name: Test and Build Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Build Docker image
        run: docker build -t qr-code-generator-app:ci .

      - name: Verify non-root container user
        run: |
          user_id=$(docker run --rm --entrypoint id qr-code-generator-app:ci -u)
          echo "Container user ID: $user_id"
          test "$user_id" -ne 0

      - name: Run QR generator inside Docker
        run: |
          docker run --name qr-ci \
            -e QR_CODE_DIR=/app/qr_codes \
            -e FILL_COLOR=black \
            -e BACK_COLOR=white \
            qr-code-generator-app:ci \
            --url https://github.com/rajaramnpatil/qr-code-generator

      - name: Verify generated PNG
        run: |
          docker cp qr-ci:/app/qr_codes ./ci_qr_codes
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = list(Path("ci_qr_codes").glob("*.png"))
          assert files, "No QR code PNG was generated"

          for file in files:
              with Image.open(file) as image:
                  assert image.format == "PNG"
                  image.verify()
              print(f"Verified PNG: {file}")
          PY

      - name: Show container logs and clean up
        if: always()
        run: |
          if docker container inspect qr-ci >/dev/null 2>&1; then
            docker logs qr-ci
            docker rm -f qr-ci
          fi